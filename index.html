<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>TizenPluto</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000;
        }
        iframe {
            width: 100%; height: 100%; border: none;
        }
    </style>
    <!-- Her loader vi adblock-scriptet før siden overhovedet får lov at starte -->
    <script src="script.js"></script>
</head>
<body>
    <iframe id="plutoFrame" src="https://pluto.tv" allow="autoplay; fullscreen; encrypted-media"></iframe>

    <script>
        // Tizen API: Sørg for at appen lukker pænt ned, når der trykkes Tilbage i hovedmenuen
        window.addEventListener('tizenhwkey', function(e) {
            if (e.keyName === "back") {
                try {
                    tizen.application.getCurrentApplication().exit();
                } catch (err) {}
            }
        });
    </script>
</body>
</html>
